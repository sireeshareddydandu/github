<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track concern Â· Workplace Wellness</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><style>.track-wrap{max-width:760px;margin:36px auto;padding:0 18px}.track-card{background:#fff;border:1px solid #e4e9e7;border-radius:18px;padding:28px;box-shadow:0 10px 30px #142b2410}.track-card h1{margin-top:0}.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.track-grid label{display:block;font-weight:600}.track-grid input{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border:1px solid #ccd7d2;border-radius:8px}.track-result{margin-top:20px;padding:18px;border-radius:12px;background:#f5f8f7}.track-result dl{display:grid;grid-template-columns:150px 1fr;gap:10px}.track-result dt{font-weight:700}.track-result dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.track-error{color:#a12626}.hidden{display:none}@media(max-width:600px){.track-grid{grid-template-columns:1fr}.track-result dl{grid-template-columns:1fr;gap:4px}.track-result dd{margin-bottom:12px}}</style></head><body class="public-page"><header class="topbar"><a class="brand" href="/submit"><span class="brand-mark">F</span><span>Workplace Wellness</span></a><a class="quiet-link" href="/submit">Back to form</a></header><main class="track-wrap"><section class="track-card"><p class="small-overline">HEALTH &amp; SAFETY</p><h1>Track your concern</h1><p class="muted">Enter the ticket ID shown after submission and the same Sopra Steria email address you registered with.</p><form id="track-form"><div class="track-grid"><label>Ticket ID<input name="ticket_id" required placeholder="WW-2026-0001" autocomplete="off"></label><label>Registered Sopra Steria email<input name="email" type="email" required placeholder="name@company.com" autocomplete="email"></label></div><p id="track-error" class="track-error" role="alert"></p><button class="button button-primary" type="submit">Check status â†’</button></form><section id="track-result" class="track-result hidden" aria-live="polite"><h2 id="result-id"></h2><dl><dt>Status</dt><dd id="result-status"></dd><dt>Progress update</dt><dd id="result-progress"></dd><dt>Pending reason</dt><dd id="result-pending"></dd><dt>Closure notes</dt><dd id="result-closure"></dd><dt>Last updated (UTC)</dt><dd id="result-updated"></dd></dl><h3>Comment history</h3><ol id="ticket-comments"><li>No comments yet.</li></ol></section></section></main><script>const form=document.getElementById('track-form');form.addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('track-error'),result=document.getElementById('track-result');error.textContent='';result.classList.add('hidden');try{const fd=new FormData(form);const r=await fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket_id:fd.get('ticket_id'),email:fd.get('email')})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to find ticket');const t=d.ticket;document.getElementById('result-id').textContent=t.ticket_id;document.getElementById('result-status').textContent=t.status;document.getElementById('result-progress').textContent=t.progress_update||'No progress update provided.';document.getElementById('result-pending').textContent=t.status==='Pending'?(t.pending_reason||'Not provided'):'â€”';document.getElementById('result-closure').textContent=t.status==='Closed'?(t.closure_notes||'Not provided'):'â€”';document.getElementById('result-updated').textContent=t.last_updated||'Not available';const list=document.getElementById('ticket-comments');list.replaceChildren();const comments=Array.isArray(t.comments)?t.comments:[];if(!comments.length){const li=document.createElement('li');li.textContent='No comments yet.';list.appendChild(li)}else{comments.forEach(c=>{const li=document.createElement('li');const head=document.createElement('strong');head.textContent=(c.admin_username||'Administrator')+' - ';const time=document.createElement('time');time.textContent=c.created_at||'Timestamp unavailable';const body=document.createElement('p');body.textContent=c.comment||'';li.append(head,time,body);list.appendChild(li)})}result.classList.remove('hidden')}catch(err){error.textContent=err.message}});</script></body></html>
